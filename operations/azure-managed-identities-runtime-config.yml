# Apply to runtime-config/juicefs-volume-driver.yml; requires BPM on compute.
- type: replace
  path: /addons/name=juicefs-volume-driver/jobs/-
  value:
    name: azure-postgres-auth-proxy
    release: juicefs
    provides:
      azure_postgres_proxy: {as: azure_postgres_proxy}
    properties:
      azure_postgres_auth_proxy:
        host: ((azure_postgres_host))
        client_id: ((azure_postgres_managed_identity_client_id))
        ca_cert: ((azure_postgres_ca_cert))
- type: replace
  path: /addons/name=juicefs-volume-driver/jobs/name=juicefs-volume-driver/consumes/azure_postgres_proxy?
  value: {from: azure_postgres_proxy}
