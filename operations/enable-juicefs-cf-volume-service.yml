- type: replace
  path: /instance_groups/name=api/jobs/name=cloud_controller_ng/properties/cc/volume_services_enabled?
  value: true
- type: replace
  path: /instance_groups/name=cc-worker/jobs/name=cloud_controller_worker/properties/cc/volume_services_enabled?
  value: true
- type: replace
  path: /instance_groups/name=scheduler/jobs/name=cloud_controller_clock/properties/cc/volume_services_enabled?
  value: true
- type: replace
  path: /instance_groups/-
  value:
    azs: [z1]
    instances: 1
    jobs:
    - name: register-broker
      release: juicefs
      consumes:
        juicefs_broker: {from: juicefs_broker, deployment: juicefs, ip_addresses: true}
        cloud_controller_https_endpoint: {from: cloud_controller_https_endpoint}
    lifecycle: errand
    name: register-juicefs-broker
    networks: [{name: default}]
    stemcell: default
    vm_type: default
    properties:
      juicefs:
        broker:
          name: juicefs
        cf:
          username: admin
          password: ((/instant-bosh/cf/cf_admin_password))
          skip_ssl_validation: false
- type: replace
  path: /instance_groups/-
  value:
    azs: [z1]
    instances: 1
    jobs:
    - name: deregister-broker
      release: juicefs
      consumes:
        juicefs_broker: {from: juicefs_broker, deployment: juicefs, ip_addresses: true}
        cloud_controller_https_endpoint: {from: cloud_controller_https_endpoint}
    lifecycle: errand
    name: deregister-juicefs-broker
    networks: [{name: default}]
    stemcell: default
    vm_type: default
    properties:
      juicefs:
        broker:
          name: juicefs
        cf:
          username: admin
          password: ((/instant-bosh/cf/cf_admin_password))
          skip_ssl_validation: false
- type: replace
  path: /releases/-
  value:
    name: juicefs
    version: latest
