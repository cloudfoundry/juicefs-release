- type: replace
  path: /addons/name=bosh-dns-aliases/jobs/name=bosh-dns-aliases/properties/aliases/domain=blobstore.service.juicefs.internal?
  value:
    domain: blobstore.service.juicefs.internal
    targets:
    - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}
- type: replace
  path: /instance_groups/name=control/jobs/name=cloud_controller_ng/properties/cc/volume_services_enabled?
  value: true
- type: replace
  path: /addons/name=bosh-dns-aliases/jobs/name=bosh-dns-aliases/properties/aliases/domain=postgres.service.juicefs.internal?
  value:
    domain: postgres.service.juicefs.internal
    targets:
    - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}
- type: replace
  path: /instance_groups/name=control/jobs/name=cloud_controller_worker/properties/cc/volume_services_enabled?
  value: true
- type: replace
  path: /instance_groups/name=control/jobs/name=cloud_controller_clock/properties/cc/volume_services_enabled?
  value: true
- type: replace
  path: /instance_groups/name=register-juicefs-broker?
  value:
    azs: [z1]
    instances: 1
    jobs:
    - name: register-broker
      release: juicefs
      consumes:
        juicefs_broker: {from: juicefs_broker, deployment: juicefs, ip_addresses: true}
        cloud_controller_https_endpoint: {from: cloud_controller_https_endpoint}
    lifecycle: errand
    name: register-juicefs-broker
    networks: [{name: default}]
    stemcell: default
    vm_type: default
    properties:
      juicefs:
        broker:
          name: juicefs
        cf:
          username: admin
          password: ((cf_admin_password))
          additional_ca_certificates: [((router_ssl.ca))]
          skip_ssl_validation: false
- type: replace
  path: /instance_groups/name=deregister-juicefs-broker?
  value:
    azs: [z1]
    instances: 1
    jobs:
    - name: deregister-broker
      release: juicefs
      consumes:
        juicefs_broker: {from: juicefs_broker, deployment: juicefs, ip_addresses: true}
        cloud_controller_https_endpoint: {from: cloud_controller_https_endpoint}
    lifecycle: errand
    name: deregister-juicefs-broker
    networks: [{name: default}]
    stemcell: default
    vm_type: default
    properties:
      juicefs:
        broker:
          name: juicefs
        cf:
          username: admin
          password: ((cf_admin_password))
          additional_ca_certificates: [((router_ssl.ca))]
          skip_ssl_validation: false
- type: replace
  path: /releases/name=juicefs?
  value:
    name: juicefs
    version: latest
