# Apply to the CF deployment to install the acceptance-test errand.
- type: replace
  path: /instance_groups/name=juicefs-acceptance-tests?
  value:
    name: juicefs-acceptance-tests
    azs: [z1]
    instances: 1
    lifecycle: errand
    vm_type: default
    stemcell: default
    networks: [{name: default}]
    jobs:
    - name: juicefs-acceptance-tests
      release: juicefs
      properties:
        juicefs:
          acceptance:
            apps_domain: ((juicefs_acceptance_apps_domain))
          cf:
            username: admin
            password: ((cf_admin_password))
            system_domain: ((juicefs_acceptance_apps_domain))
            additional_ca_certificates: [((router_ssl.ca))]
            skip_ssl_validation: false
- type: replace
  path: /releases/name=juicefs?
  value:
    name: juicefs
    version: ((juicefs_release_version))
