# Adds validation backend DNS aliases to upstream cf-deployment. The alias
# targets the JuiceFS deployment and is independent of CF instance-group names.
- type: replace
  path: /addons/name=bosh-dns-aliases/jobs/name=bosh-dns-aliases/properties/aliases/domain=blobstore.service.juicefs.internal?
  value:
    domain: blobstore.service.juicefs.internal
    targets:
    - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}
- type: replace
  path: /addons/name=bosh-dns-aliases/jobs/name=bosh-dns-aliases/properties/aliases/domain=postgres.service.juicefs.internal?
  value:
    domain: postgres.service.juicefs.internal
    targets:
    - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}
