# Apply after non-ha-validation.yml. Reuse the CF stemcell and alias release.
- type: replace
  path: /stemcells/alias=default/version
  value: ((acceptance_stemcell_version))
- type: replace
  path: /releases/name=bosh-dns-aliases
  value:
    name: bosh-dns-aliases
    version: ((acceptance_dns_aliases_version))
- type: replace
  path: /releases/name=juicefs/version
  value: ((juicefs_release_version))
- type: replace
  path: /instance_groups/name=juicefs-backends/persistent_disk
  value: 10240
