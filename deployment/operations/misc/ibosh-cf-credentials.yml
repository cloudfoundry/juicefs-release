# Reuse CF credentials from instant-bosh's config-server namespace.
- type: replace
  path: /instance_groups/name=juicefs-broker/properties/juicefs/cf/password
  value: ((/instant-bosh/cf/cf_admin_password))
- type: replace
  path: /instance_groups/name=juicefs-broker/properties/juicefs/cf/additional_ca_certificates
  value: [((/instant-bosh/cf/router_ssl.ca))]
