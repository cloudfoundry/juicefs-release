# instant-bosh embeds DNS in CF instead of installing a director runtime-config.
# Reuse the global certificates already generated by the CF deployment.
- type: replace
  path: /releases/name=bosh-dns?
  value:
    name: bosh-dns
    version: 1.39.34
    url: https://bosh.io/d/github.com/cloudfoundry/bosh-dns-release?v=1.39.34
    sha1: 7561733fb62595b0ccf6b73d771902da4bc519be
- type: replace
  path: /addons?/name=ibosh-bosh-dns?
  value:
    name: ibosh-bosh-dns
    jobs:
    - name: bosh-dns
      release: bosh-dns
      properties:
        configure_systemd_resolved: true
        override_nameserver: false
        disable_recursors: true
        cache: {enabled: true}
        api:
          client: {tls: ((/dns_api_client_tls))}
          server: {tls: ((/dns_api_server_tls))}
        health:
          enabled: true
          client: {tls: ((/dns_healthcheck_client_tls))}
          server: {tls: ((/dns_healthcheck_server_tls))}
