# Disposable validation backends. Each singleton owns a separate persistent disk;
# increasing instances does not create HA or shared object storage.
- type: replace
  path: /releases/-
  value:
    name: postgres
    version: '57.0.0'
    url: https://bosh.io/d/github.com/cloudfoundry/postgres-release?v=57.0.0
    sha1: sha256:fc5f73f57a6b9e7208e4293a7fb7faf11e4fb8fc8bb79db80d0d97e41ab1ee2a
- type: replace
  path: /releases/name=bpm?
  value:
    name: bpm
    version: '1.4.41'
    url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
    sha1: sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
- type: replace
  path: /releases/-
  value:
    name: bosh-dns-aliases
    version: 0.0.5
    url: https://bosh.io/d/github.com/cloudfoundry/bosh-dns-aliases-release?v=0.0.5
    sha1: sha256:a140a3e0aef083c1b356970ddd27fe6a84d7d9272a4dded7c3cb4e55d0e4247e
- type: replace
  path: /addons?/name=juicefs-validation-aliases?
  value:
    name: juicefs-validation-aliases
    jobs:
    - name: bosh-dns-aliases
      release: bosh-dns-aliases
      properties:
        aliases:
        - domain: postgres.service.juicefs.internal
          targets:
          - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}
        - domain: blobstore.service.juicefs.internal
          targets:
          - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}
- type: replace
  path: /instance_groups/0:before
  value:
    name: juicefs-backends
    azs: [z1]
    instances: 1
    vm_type: default
    stemcell: default
    persistent_disk: 51200
    networks:
    - name: default
    jobs:
    - name: postgres
      release: postgres
      provides:
        postgres: {as: postgres, shared: true}
      properties:
        databases:
          databases:
          - name: juicefs
          roles:
          - name: juicefs
            password: ((juicefs_postgres_password))
    - name: bpm
      release: bpm
    - name: blobstore
      release: juicefs
      provides:
        blobstore: {shared: true}
      properties:
        blobstore:
          admin_users:
          - username: juicefs
            password: ((juicefs_blobstore_password))
          tls:
            cert: ((juicefs_blobstore_server_tls.certificate))
            private_key: ((juicefs_blobstore_server_tls.private_key))
            ca: ((juicefs_blobstore_ca.certificate))
          hostname: blobstore.service.juicefs.internal
- type: replace
  path: /instance_groups/name=juicefs-broker/jobs/name=juicefs-volume/properties/juicefs/metadata
  value:
    type: postgres
    host: postgres.service.juicefs.internal
    port: 5432
    database: juicefs
    user: juicefs
    password: ((juicefs_postgres_password))
    options: sslmode=disable
- type: replace
  path: /instance_groups/name=juicefs-broker/jobs/name=juicefs-volume/properties/juicefs/storage
  value:
    type: webdav
    bucket: https://blobstore.service.juicefs.internal:4443/admin/
    access_key: juicefs
    secret_key: ((juicefs_blobstore_password))
    ca_cert: ((juicefs_blobstore_ca.certificate))
- type: replace
  path: /variables/-
  value: {name: juicefs_postgres_password, type: password}
- type: replace
  path: /variables/-
  value: {name: juicefs_blobstore_password, type: password}
- type: replace
  path: /variables/-
  value:
    name: juicefs_blobstore_ca
    type: certificate
    options:
      is_ca: true
      common_name: juicefs-blobstore-ca
- type: replace
  path: /variables/-
  value:
    name: juicefs_blobstore_server_tls
    type: certificate
    update_mode: converge
    options:
      ca: juicefs_blobstore_ca
      common_name: blobstore.service.juicefs.internal
      alternative_names: [blobstore.service.juicefs.internal]
      extended_key_usage: [server_auth]
