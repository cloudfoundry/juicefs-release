---
name: juicefs

releases:
- name: juicefs
  version: latest
- name: postgres
  version: '57.0.0'
  url: https://bosh.io/d/github.com/cloudfoundry/postgres-release?v=57.0.0
  sha1: sha256:fc5f73f57a6b9e7208e4293a7fb7faf11e4fb8fc8bb79db80d0d97e41ab1ee2a
- name: bpm
  version: '1.4.41'
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
  sha1: sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
- name: bosh-dns
  version: 1.39.30
- name: bosh-dns-aliases
  version: 0.0.4

addons:
- name: juicefs-dns
  jobs:
  - name: bosh-dns
    release: bosh-dns
    properties:
      configure_systemd_resolved: true
      override_nameserver: false
      disable_recursors: true
      cache: {enabled: true}
      api:
        client: {tls: ((/dns_api_client_tls))}
        server: {tls: ((/dns_api_server_tls))}
      health:
        enabled: true
        client: {tls: ((/dns_healthcheck_client_tls))}
        server: {tls: ((/dns_healthcheck_server_tls))}
  - name: bosh-dns-aliases
    release: bosh-dns-aliases
    properties:
      aliases:
      - domain: blobstore.service.juicefs.internal
        targets:
        - {query: '*', instance_group: juicefs-backends, deployment: juicefs, network: default, domain: bosh}

stemcells:
- alias: default
  os: ubuntu-noble
  version: latest

update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 30000-60000
  update_watch_time: 30000-60000

instance_groups:
- name: juicefs-backends
  azs: [z1]
  instances: 1
  vm_type: default
  stemcell: default
  persistent_disk: 20480
  networks:
  - name: default
  jobs:
  - name: postgres
    release: postgres
    provides:
      postgres: {as: postgres, shared: true}
    properties:
      databases:
        databases:
        - name: juicefs
        roles:
        - name: juicefs
          password: ((juicefs_postgres_password))
  - name: bpm
    release: bpm
  - name: blobstore
    release: juicefs
    provides:
      blobstore: {shared: true}
    properties:
      blobstore:
        admin_users:
        - username: juicefs
          password: ((juicefs_blobstore_password))
        tls:
          cert: ((juicefs_blobstore_server_tls.certificate))
          private_key: ((juicefs_blobstore_server_tls.private_key))
          ca: ((juicefs_blobstore_ca.certificate))
        hostname: blobstore.service.juicefs.internal
- name: juicefs-broker
  migrated_from:
  - name: juicefs-mount-broker
    az: z1
  azs: [z1]
  instances: 1
  vm_type: default
  stemcell: default
  networks:
  - name: default
  jobs:
  - name: juicefs-volume
    release: juicefs
    properties:
      juicefs:
        volume:
          initialize: true
    provides:
      juicefs_mount: {shared: true}
    consumes:
      postgres: {from: postgres, ip_addresses: true}
      blobstore: {from: blobstore, ip_addresses: true}
  - name: juicefs-broker
    release: juicefs
    provides:
      juicefs_broker: {shared: true}
    properties:
      juicefs:
        broker:
          password: ((juicefs-broker-password))
          plans:
          - id: 40bf3e21-885a-4c2a-99b4-d4e8186c467e
            name: shared
            description: Shared JuiceFS directory without a quota
            free: true
            capacity_gib: 0
            inodes: 0
          - id: 5d3c1f42-eaa0-4d1b-88ce-b26cf6545cb1
            name: small
            description: Shared JuiceFS directory with 1 GiB and 1000 inodes
            free: true
            capacity_gib: 1
            inodes: 1000
    consumes:
      juicefs_mount: {from: juicefs_mount}
variables:
- name: juicefs-broker-password
  type: password
- name: juicefs_postgres_password
  type: password
- name: juicefs_blobstore_password
  type: password
- name: juicefs_blobstore_ca
  type: certificate
  options:
    is_ca: true
    common_name: juicefs-blobstore-ca
- name: juicefs_blobstore_server_tls
  type: certificate
  update_mode: converge
  options:
    ca: juicefs_blobstore_ca
    common_name: blobstore.service.juicefs.internal
    alternative_names:
    - blobstore.service.juicefs.internal
    extended_key_usage: [server_auth]
